name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go vet + test + build
        run: |
          go vet ./...
          go test ./...
          go build ./...

      - name: Binary derleniyor mu (gömülü arayüzle)
        run: go build -trimpath -o /tmp/nomi-ci .
